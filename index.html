<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/><meta name="theme-color" content="#111c21"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/><meta name="apple-mobile-web-app-title" content="RROP Test"/><title>RROP — iPhone тест v1.5</title>
<style>
:root{color-scheme:dark;--bg:#111c21;--card:#22343a;--ink:#f1f1e3;--muted:#b7c7c3;--gold:#e2af5d}*{box-sizing:border-box}html{height:100%;overflow:hidden;overscroll-behavior:none}body{margin:0;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}button{appearance:none;-webkit-appearance:none;border:1px solid #65777a;border-radius:12px;background:#344b53;color:var(--ink);font:700 17px system-ui;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}button.held{background:var(--gold);color:#17212a;box-shadow:0 0 0 2px #fff5}button:focus-visible{outline:2px solid white}#app{height:100%;height:100dvh;display:flex;flex-direction:column;gap:7px;padding:max(7px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(7px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));max-width:1050px;margin:auto}header{display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:34px}h1{margin:0;font-size:15px}small,.hint{color:var(--muted);font-size:11px}#fullscreen{font-size:12px;padding:9px}#stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:none}canvas{display:block;max-width:100%;max-height:100%;aspect-ratio:16/10;width:auto;height:auto;object-fit:contain;border:2px solid #82918a;border-radius:8px;image-rendering:pixelated;touch-action:none;background:#1f3324}#status{padding:6px 9px;min-height:26px;background:#1b2c32;border-radius:8px;color:#e8e6d2;font-size:12px;line-height:1.25;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.controls{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:9px;align-items:center;justify-items:center}.pad{display:grid;grid-template-columns:repeat(3,clamp(45px,11vw,65px));grid-template-rows:repeat(3,clamp(45px,11vw,65px));gap:3px}.pad button:nth-child(1){grid-area:1/2}.pad button:nth-child(2){grid-area:2/1}.pad button:nth-child(3){grid-area:2/3}.pad button:nth-child(4){grid-area:3/2}.buttons{display:grid;grid-template-columns:repeat(3,clamp(45px,11vw,65px));grid-template-rows:repeat(2,clamp(45px,11vw,65px));gap:4px}.buttons .start{grid-column:1/4;font-size:13px}.readout{font-size:11px;color:var(--muted);display:flex;gap:8px;justify-content:space-between;align-items:center}.readout strong{color:var(--gold)}#info{font:inherit;white-space:normal;text-align:right}#reset{font-size:11px;padding:5px 10px}#help{display:none;background:#2c434a;padding:8px;border-radius:9px;font-size:12px}#help.show{display:block}@media (orientation:landscape) and (max-height:550px){#app{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;gap:4px 10px}header{grid-column:1/3}#stage{grid-column:1;grid-row:2;min-height:0}#status{grid-column:1;grid-row:3}.controls{grid-column:2;grid-row:2/4;grid-template-columns:auto auto;gap:7px}.pad{grid-template-columns:repeat(3,clamp(35px,9.1vh,58px));grid-template-rows:repeat(3,clamp(35px,9.1vh,58px))}.buttons{grid-template-columns:repeat(3,clamp(35px,9.1vh,58px));grid-template-rows:repeat(2,clamp(35px,9.1vh,58px))}#readout{display:none}#help{grid-column:1/3}canvas{aspect-ratio:16/10}}@media(max-height:640px) and (orientation:portrait){.pad{grid-template-columns:repeat(3,43px);grid-template-rows:repeat(3,43px)}.buttons{grid-template-columns:repeat(3,43px);grid-template-rows:repeat(2,43px)}.readout{font-size:10px}}
</style></head><body><div id="app"><header><div><h1>Rings of Power · iPhone v1.5</h1><small>Тест ввода · не ROM</small></div><button id="fullscreen">Режим экрана</button></header><div id="stage"><canvas id="screen" width="640" height="400" aria-label="Диагностическое игровое поле"></canvas></div><div id="status" aria-live="off">Проверь удержание двух кнопок одновременно.</div><section class="controls" id="gamecontrols" aria-label="Управление"><div class="pad"><button data-btn="up" aria-label="Вверх">▲</button><button data-btn="left" aria-label="Влево">◀</button><button data-btn="right" aria-label="Вправо">▶</button><button data-btn="down" aria-label="Вниз">▼</button></div><div class="buttons"><button data-btn="a">A</button><button data-btn="b">B</button><button data-btn="c">C</button><button class="start" data-btn="start">START</button></div></section><div class="readout" id="readout"><span>Одновременно зажато: <strong id="count">0</strong> · Максимум: <strong id="max">0</strong></span><button id="reset">Сброс</button><span id="info">Прокрутка заблокирована</span></div><div id="help" role="status"></div></div><script>
(()=>{'use strict';
const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),countEl=document.getElementById('count'),maxEl=document.getElementById('max'),help=document.getElementById('help');
const pointers=new Map(),keyboard=new Set(),pressed=new Set();const keys={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',z:'a',x:'b',c:'c',Enter:'start'};let x=8,y=5,steps=0,action='Готов к тесту',maxHeld=0,lastStep=0,simultaneous=false,cancelCount=0;
function aggregate(){const s=new Set(keyboard);for(const v of pointers.values())s.add(v);const newly=[...s].filter(v=>!pressed.has(v));pressed.clear();for(const v of s)pressed.add(v);for(const v of newly)if(['a','b','c','start'].includes(v))action='Кнопка '+v.toUpperCase();if(s.size>=2){simultaneous=true;action='Два нажатия одновременно подтверждены'}maxHeld=Math.max(maxHeld,s.size);countEl.textContent=String(s.size);maxEl.textContent=String(maxHeld);document.querySelectorAll('[data-btn]').forEach(b=>b.classList.toggle('held',s.has(b.dataset.btn)));status.textContent=`${action} · зажато: ${[...s].join(' + ')||'нет'} · шаги: ${steps} · pointercancel: ${cancelCount}`;}
const buttons=document.querySelectorAll('[data-btn]');buttons.forEach(button=>{button.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();pointers.set(e.pointerId,button.dataset.btn);try{button.setPointerCapture(e.pointerId)}catch(_){}aggregate()});const done=e=>{if(pointers.has(e.pointerId)){pointers.delete(e.pointerId);if(e.type==='pointercancel')cancelCount++;aggregate()}};button.addEventListener('pointerup',done);button.addEventListener('pointercancel',done);button.addEventListener('lostpointercapture',done)});
window.addEventListener('pointerup',e=>{if(pointers.delete(e.pointerId))aggregate()});window.addEventListener('pointercancel',e=>{if(pointers.delete(e.pointerId)){cancelCount++;aggregate()}});
window.addEventListener('keydown',e=>{const k=keys[e.key]||keys[e.key.toLowerCase?.()];if(k){e.preventDefault();keyboard.add(k);aggregate()}});window.addEventListener('keyup',e=>{const k=keys[e.key]||keys[e.key.toLowerCase?.()];if(k){e.preventDefault();keyboard.delete(k);aggregate()}});function release(){pointers.clear();keyboard.clear();aggregate()}window.addEventListener('blur',release);document.addEventListener('visibilitychange',()=>{if(document.hidden)release()});
// iOS Safari может игнорировать CSS-only overscroll restrictions. Cancel gestures only on game surface.
const gameArea=document.getElementById('app');gameArea.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault()},{passive:false});gameArea.addEventListener('gesturestart',e=>{if(e.cancelable)e.preventDefault()},{passive:false});gameArea.addEventListener('gesturechange',e=>{if(e.cancelable)e.preventDefault()},{passive:false});gameArea.addEventListener('contextmenu',e=>e.preventDefault());
const fsButton=document.getElementById('fullscreen');fsButton.addEventListener('click',async()=>{if(document.fullscreenElement){try{await document.exitFullscreen()}catch(_){}return;}if(typeof document.documentElement.requestFullscreen==='function'){try{await document.documentElement.requestFullscreen();return}catch(_){}}help.classList.add('show');help.textContent='На iPhone обычный полноэкранный режим Safari может быть недоступен. Для режима веб-приложения: Safari → Поделиться → На экран «Домой» → открыть значок с главного экрана. Ссылка должна быть открыта по HTTPS.'});
document.getElementById('reset').addEventListener('click',()=>{release();maxHeld=0;steps=0;simultaneous=false;cancelCount=0;x=8;y=5;action='Сброшено';aggregate()});
function render(t){if(t-lastStep>=115){const dx=Number(pressed.has('right'))-Number(pressed.has('left')),dy=Number(pressed.has('down'))-Number(pressed.has('up'));if(dx||dy){x=Math.max(0,Math.min(15,x+dx));y=Math.max(0,Math.min(9,y+dy));steps++;if(!simultaneous)action='Перемещение';aggregate()}lastStep=t;}ctx.fillStyle='#13251d';ctx.fillRect(0,0,640,400);for(let a=0;a<16;a++)for(let b=0;b<10;b++){ctx.fillStyle=(a+b)%2?'#2b4935':'#31543e';ctx.fillRect(a*40,b*40,39,39)}for(const [a,b] of [[3,2],[11,7],[13,3]]){ctx.fillStyle='#c3a85e';ctx.fillRect(a*40+14,b*40+12,12,14)}ctx.fillStyle='#161b2c';ctx.fillRect(x*40+9,y*40+12,23,23);ctx.fillStyle='#ebc87a';ctx.fillRect(x*40+13,y*40+4,15,16);ctx.fillStyle='#5574b6';ctx.fillRect(x*40+10,y*40+21,21,12);requestAnimationFrame(render)}aggregate();requestAnimationFrame(render);
})();
</script></body></html>

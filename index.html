<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>RROP Mobile Touch Test</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#101826;color:#e9eef8;font:15px system-ui;height:100%;overscroll-behavior:none}main{max-width:900px;margin:auto;padding:12px;min-height:100dvh;display:flex;flex-direction:column;gap:12px}header{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:17px;margin:0}small{color:#bdcadc}button{font:700 17px system-ui;cursor:pointer;background:#304360;color:white;border:1px solid #74839a;border-radius:13px;touch-action:none;user-select:none;-webkit-user-select:none}button.held{background:#d6a75d;color:#172030}button:focus-visible{outline:2px solid white}#screen{display:block;width:100%;height:auto;aspect-ratio:16/10;border:2px solid #617284;border-radius:11px;image-rendering:pixelated;background:#152822;touch-action:none}#status{margin:0;color:#c6d6e9;font-size:13px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center;flex:1}.pad{display:grid;grid-template-columns:repeat(3,minmax(42px,68px));grid-template-rows:repeat(3,minmax(42px,68px));gap:4px;justify-content:center}.pad button:nth-child(1){grid-area:1/2}.pad button:nth-child(2){grid-area:2/1}.pad button:nth-child(3){grid-area:2/3}.pad button:nth-child(4){grid-area:3/2}.buttons{display:grid;grid-template-columns:repeat(3,minmax(42px,68px));gap:5px;justify-content:center}.buttons button{min-height:61px}.buttons .start{grid-column:1/4;min-height:43px;font-size:14px}#full{padding:9px 10px;font-size:13px}footer{font-size:12px;color:#a5b4c9}body.landscape main{max-width:1100px}@media(max-width:410px){main{padding:8px;gap:8px}.pad{grid-template-columns:repeat(3,minmax(40px,58px));grid-template-rows:repeat(3,55px)}.buttons{grid-template-columns:repeat(3,minmax(37px,58px))}.buttons button{min-height:54px}.controls{gap:5px}}@media(orientation:landscape) and (max-height:520px){main{flex-direction:row;flex-wrap:wrap;align-content:start}.screenwrap{width:53%}.controls{width:43%;display:flex;justify-content:space-around}.pad{grid-template-columns:repeat(3,45px);grid-template-rows:repeat(3,45px)}.buttons{grid-template-columns:repeat(3,45px)}.buttons button{min-height:45px}header,footer{width:100%}#screen{aspect-ratio:16/9}}
</style></head><body><main><header><div><h1>Rings of Power · тест управления</h1><small>Standalone · без ROM и интернета</small></div><button id="full">На весь экран</button></header><div class="screenwrap"><canvas id="screen" width="640" height="400"></canvas><p id="status" aria-live="polite">Крестовина перемещает героя; кнопки A/B/C вызывают действие.</p></div><div class="controls"><div class="pad"><button data-btn="up">▲</button><button data-btn="left">◀</button><button data-btn="right">▶</button><button data-btn="down">▼</button></div><div class="buttons"><button data-btn="a">A</button><button data-btn="b">B</button><button data-btn="c">C</button><button class="start" data-btn="start">START</button></div></div><footer>Диагностическая сцена — это не сама Rings of Power. Проверь поворот экрана, одновременное нажатие и удобство кнопок.</footer></main><script>
(()=>{'use strict';const canvas=document.querySelector('#screen'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');let x=8,y=5,action='Исследование',moves=0;const down=new Set(),pointers=new Map();let last=0;const keyNames={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',z:'a',x:'b',c:'c',Enter:'start'};function update(){status.textContent=`${action} · X=${x}, Y=${y} · шагов: ${moves} · зажато: ${[...down].join(', ')||'нет'}`;}function press(btn,held){if(held){if(!down.has(btn)){down.add(btn);if(['a','b','c','start'].includes(btn)){action=btn==='start'?'Меню':`Действие ${btn.toUpperCase()}`;update()}}}else down.delete(btn);document.querySelectorAll(`[data-btn="${btn}"]`).forEach(e=>e.classList.toggle('held',down.has(btn)))}document.querySelectorAll('[data-btn]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}pointers.set(e.pointerId,b.dataset.btn);press(b.dataset.btn,true)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,e=>{if(pointers.has(e.pointerId)){let v=pointers.get(e.pointerId);pointers.delete(e.pointerId);if(![...pointers.values()].includes(v))press(v,false)}})});addEventListener('keydown',e=>{let k=keyNames[e.key];if(k){e.preventDefault();press(k,true)}});addEventListener('keyup',e=>{let k=keyNames[e.key];if(k){e.preventDefault();press(k,false)}});addEventListener('blur',()=>{for(const k of [...down])press(k,false);pointers.clear()});document.querySelector('#full').addEventListener('click',()=>document.documentElement.requestFullscreen?.().catch(()=>{}));function frame(ms){if(ms-last>120){let dx=Number(down.has('right'))-Number(down.has('left')),dy=Number(down.has('down'))-Number(down.has('up'));if(dx||dy){x=Math.max(0,Math.min(15,x+dx));y=Math.max(0,Math.min(9,y+dy));moves++;action='Перемещение';update()}last=ms;}ctx.fillStyle='#12251e';ctx.fillRect(0,0,640,400);for(let i=0;i<16;i++)for(let j=0;j<10;j++){ctx.fillStyle=(i+j)%2?'#2b4935':'#31543e';ctx.fillRect(i*40,j*40,39,39)}for(const [a,b] of [[3,2],[11,7],[13,3]]){ctx.fillStyle='#c3a85e';ctx.fillRect(a*40+15,b*40+14,11,12)}ctx.fillStyle='#1b1c32';ctx.fillRect(x*40+9,y*40+12,23,23);ctx.fillStyle='#f0ce86';ctx.fillRect(x*40+13,y*40+4,15,16);ctx.fillStyle='#526fc1';ctx.fillRect(x*40+10,y*40+21,21,12);requestAnimationFrame(frame)}update();requestAnimationFrame(frame)})();
</script></body></html>
